name: App release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.artifact-target-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc
            bundles: nsis
            target-args: ''
            artifact-paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
          - runner: ubuntu-latest
            artifact-target-name: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            target-args: ''
            artifact-paths: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/appimage/*.AppImage.sig
              target/release/bundle/appimage/*.AppImage.tar.gz
              target/release/bundle/appimage/*.AppImage.tar.gz.sig
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - runner: macos-latest			artifact-target-name: universal-apple-darwin
			# `app` is what produces the macOS updater archive; `dmg` is the installer
			bundles: dmg,app
            target-args: '--target universal-apple-darwin'
            artifact-paths: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    runs-on: ${{ matrix.runner }}
    env:
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      # Signs the bundles so an installed PackForge can verify and apply updates
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''

      - name: Add macOS build targets
        if: matrix.artifact-target-name == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Configure app environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        shell: bash
        run: pnpm --filter=@modrinth/app run tauri build ${{ matrix.target-args }} --config tauri.packforge-release.conf.json --bundles "${{ matrix.bundles }}"

      - name: Upload app bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-target-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # `gh release` needs a git repository in the workspace
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download app bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bundles
          merge-multiple: true

      - name: Build update manifest
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"

          manifest=$(jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: "", pub_date: $pub_date, platforms: {}}')

          add_platform() {
            local key="$1" archive="$2"
            if [ -z "$archive" ] || [ ! -f "$archive.sig" ]; then
              echo "::warning::No signed updater artifact for $key"
              return 0
            fi
            manifest=$(jq \
              --arg key "$key" \
              --arg url "$base/$(basename "$archive")" \
              --arg sig "$(cat "$archive.sig")" \
              '.platforms[$key] = {signature: $sig, url: $url}' <<<"$manifest")
          }

          # macOS is a universal build, so both architectures share one archive
          mac_archive=$(find bundles -name '*.app.tar.gz' | head -1)

          add_platform windows-x86_64 "$(find bundles -name '*.exe' | head -1)"
          add_platform linux-x86_64 "$(find bundles -name '*.AppImage.tar.gz' | head -1)"
          add_platform darwin-aarch64 "$mac_archive"
          add_platform darwin-x86_64 "$mac_archive"

          printf '%s\n' "$manifest" > latest.json
          jq . latest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          mapfile -t files < <(find bundles -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) | sort)
          files+=(latest.json)

          if [ ${#files[@]} -le 1 ]; then
            echo "::error::No installer artifacts were found to release"
            exit 1
          fi

          printf 'Releasing %s with artifacts:\n' "$tag"
          printf '  %s\n' "${files[@]}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Publish the assets of a release that was created without them
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${files[@]}"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "PackForge ${tag#v}" \
              --generate-notes \
              "${files[@]}"
          fi
